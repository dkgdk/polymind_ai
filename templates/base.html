<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}PolyMind AI{% endblock %}</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0fdf4',
                            100: '#dcfce7',
                            500: '#22c55e',
                            600: '#16a34a',
                            700: '#15803d',
                        },
                        mistral: {
                            orange: '#ff7000',
                            amber: '#f59e0b'
                        }
                    }
                }
            }
        }
    </script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Marked.js for markdown rendering -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap');
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
        code, pre {
            font-family: 'JetBrains Mono', monospace;
        }
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.04);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(156, 163, 175, 0.4);
            border-radius: 9999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(156, 163, 175, 0.7);
        }
        .prose pre {
            background-color: #1e293b;
            color: #f8fafc;
            padding: 0.85rem 1rem;
            border-radius: 0.5rem;
            overflow-x: auto;
            margin: 0.6rem 0;
        }
        .prose p {
            margin-bottom: 0.5rem;
        }
        .prose p:last-child {
            margin-bottom: 0;
        }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col antialiased selection:bg-indigo-500 selection:text-white">

    <div class="flex-1 flex overflow-hidden">
        {% block content %}{% endblock %}
    </div>

    <!-- Notification Toast -->
    <div id="toast-container" class="fixed bottom-5 right-5 z-50 flex flex-col gap-2 pointer-events-none"></div>

    <!-- Global App Helpers -->
    <script>
        // Authentication & API helper
        const API = {
            getToken() {
                return localStorage.getItem('access_token');
            },
            getRefreshToken() {
                return localStorage.getItem('refresh_token');
            },
            setTokens(access, refresh) {
                localStorage.setItem('access_token', access);
                if (refresh) localStorage.setItem('refresh_token', refresh);
            },
            clearTokens() {
                localStorage.removeItem('access_token');
                localStorage.removeItem('refresh_token');
                localStorage.removeItem('user_cache');
            },
            isAuthenticated() {
                return !!this.getToken();
            },
            async fetch(url, options = {}) {
                options.headers = options.headers || {};
                const token = this.getToken();
                if (token) {
                    options.headers['Authorization'] = `Bearer ${token}`;
                }
                if (!(options.body instanceof FormData) && !options.headers['Content-Type']) {
                    options.headers['Content-Type'] = 'application/json';
                }

                let response = await fetch(url, options);

                // Token expired - try refresh
                if (response.status === 401 && this.getRefreshToken()) {
                    const refreshed = await this.refreshToken();
                    if (refreshed) {
                        options.headers['Authorization'] = `Bearer ${this.getToken()}`;
                        response = await fetch(url, options);
                    } else {
                        this.clearTokens();
                        if (!window.location.pathname.includes('/auth/')) {
                            window.location.href = '/auth/';
                        }
                    }
                } else if (response.status === 401 && !window.location.pathname.includes('/auth/')) {
                    this.clearTokens();
                    window.location.href = '/auth/';
                }

                return response;
            },
            async refreshToken() {
                const refresh = this.getRefreshToken();
                if (!refresh) return false;
                try {
                    const res = await fetch('/api/users/token/refresh/', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ refresh })
                    });
                    if (res.ok) {
                        const data = await res.json();
                        localStorage.setItem('access_token', data.access);
                        return true;
                    }
                } catch (e) {
                    console.error('Refresh token error:', e);
                }
                return false;
            }
        };

        function showToast(message, type = 'info') {
            const container = document.getElementById('toast-container');
            if (!container) return;
            const toast = document.createElement('div');
            const bgClass = type === 'success' ? 'bg-emerald-600 text-white' :
                            type === 'error' ? 'bg-rose-600 text-white' : 'bg-slate-800 text-slate-100 border border-slate-700';
            toast.className = `${bgClass} px-4 py-2.5 rounded-xl shadow-xl text-sm font-medium flex items-center gap-2 transform transition-all duration-300 translate-y-3 opacity-0 pointer-events-auto`;
            toast.innerHTML = `<span>${message}</span>`;
            container.appendChild(toast);

            requestAnimationFrame(() => {
                toast.classList.remove('translate-y-3', 'opacity-0');
            });

            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-2');
                setTimeout(() => toast.remove(), 300);
            }, 3500);
        }

        document.addEventListener('DOMContentLoaded', () => {
            if (window.lucide) {
                lucide.createIcons();
            }
        });
    </script>
    {% block extra_js %}{% endblock %}
</body>
</html>
